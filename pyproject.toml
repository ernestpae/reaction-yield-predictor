[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reaction-yield-predictor"
version = "0.2.0"
description = "An educational, reproducible ML workflow for synthetic reaction yields"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.8,<1.9",
  "matplotlib>=3.9,<4", "joblib>=1.4,<2",
]

[project.scripts]
yield-predictor = "yield_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
